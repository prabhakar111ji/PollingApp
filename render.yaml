version: "1"

databases:
  - name: polling-db
    databaseName: pollingdb
    user: pollinguser
    plan: free

services:
  - type: web
    name: polling-backend
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: polling-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: polling-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: polling-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: polling-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: polling-db
          property: password
      - key: spring_datasource_url
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
      - key: spring_datasource_driver-class-name
        value: org.postgresql.Driver
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: polling-frontend
          property: url

  - type: web
    name: polling-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: polling-backend
          property: url

# Server
spring.application.name=polling-app
server.port=${PORT:8080}

# PostgreSQL Database (Neon Cloud in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/poll_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:myDefaultDevSecretKeyThatIsLongEnoughForHMACSHA256Algorithm123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.pollingapp=INFO
